<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
      http-equiv="Content-Security-Policy"
      content="
    default-src 'self';
    img-src *;
    script-src 'self' 'unsafe-inline';
     style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;;
    font-src 'self' https://fonts.gstatic.com;;
"
    />
    <title>SRM Timetable Finder</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/obfuscated.css') }}"
    />
    <script>
      var departmentToStaff = {{ departmentToStaff | tojson }};
      var departmentToClassName= {{ departmentToClassName | tojson }}
    </script>
    <script src="{{ url_for('static', filename='js/obfuscated.js') }}" defer></script>
    <script>
      window.history.forward();
   </script>
  </head>
  <body>
    <h2 style="display: flex; flex-direction: column; align-items: center">
      Class Room Finder
    </h2>
    <div class="formbold-main-wrapper" style="padding: 8px;">
      <div class="formbold-form-wrapper">
        <form
          style="background-color: #f1ffff; border-radius: 10px; outline: none"
          id="form"
          method="post"
        >
          <div class="formbold-input-flex">
             <div>
              <label for="day" class="formbold-form-label"><b>Day*</b></label>
              <select name="day" id="day" class="formbold-form-input" required>
                <option value="" disabled selected>Select</option>
                <option value="1">Day 1</option>
                <option value="2">Day 2</option>
                <option value="3">Day 3</option>
                <option value="4">Day 4</option>
                <option value="5">Day 5</option>
              </select>
            </div>
            <div>
              <label for="period" class="formbold-form-label"
                ><b>Period*</b></label
              >
              <select
                name="period"
                id="period"
                class="formbold-form-input"
                required
              >
                <option value="" disabled selected>Select</option>
                <option value="I">1(8.15-9.05)</option>
                <option value="II">2(9.05-9.55)</option>
                <option value="III">3(9.55-10.45)</option>
                <option value="IV">4(11.00-11.45)</option>
                <option value="V">5(11.45-12.30)</option>
                <option value="VI">6(12.35-1.25)</option>
                <option value="VII">7(1.25-2.15)</option>
                <option value="VIII">8(2.15-3.05)</option>
                <option value="IX">9(3.20-4.05)</option>
                <option value="X">10(4.05-4.50)</option>
                <option value="ONLINE">ONLINE</option>
              </select>
            </div>
            <div>
              <label for="department" class="formbold-form-label">
                <b>Department*</b>
              </label>
              <select
                id="department"
                name="department"
                class="formbold-form-input"
                required
              >
                <option value="" selected>Select</option>
                {% for department in departments %}
                <option value="{{ department }}">{{ department }}</option>
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="formbold-input-flex">
                <div>
              <label for="class" class="formbold-form-label">
                <b>Class</b>
              </label>
              <select
                id="class"
                name="class"
                class="formbold-form-input"
              >
              </select>
            </div>
              <div>
              <label for="roomNo" class="formbold-form-label"
                ><b>Room No</b></label
              >
              <input
                type="text"
                name="roomNo"
                id="roomNo"
                placeholder="403"
                class="formbold-form-input"
              />
            </div>
                <div>
              <label for="staffName" class="formbold-form-label">
                <b>Staff Name</b>
              </label>
              <select
                id="staffName"
                name="staffName"
                class="formbold-form-input"
              >
              </select>
            </div>
          </div>

          <div>
            <label for="subject" class="formbold-form-label">
              <b> Subject of the period </b>
            </label>
            <div
              style="
                border: 1px solid #ccc;
                padding: 10px;
                background-color: #fff;
                border-radius: 8px;
              "
            >
              {% if result and 'error' not in result  %}
              <label
                for="message"
                class="formbold-form-label"
                style="color: #6a64f1; display: flex; padding-right: 10px"
              >
                <h4><i>Staff Name:</i></h4>
                <h3 style="color: #010102; padding-left: 10px">
                  {{ result['Staff Name'] }}
                </h3>
              </label>
              <br />
              <label
                for="message"
                class="formbold-form-label"
                style="color: #6a64f1; display: flex; padding-right: 10px"
              >
                <h4><i>Subject:</i></h4>
                <h3 style="color: #010102; padding-left: 10px">
                  {{ result['Subject'] }}
                </h3>
              </label>
              <br />
              <label
                for="message"
                class="formbold-form-label"
                style="color: #6a64f1; display: flex; padding-right: 10px"
              >
                <h4><i>Room No:</i></h4>
                <h3 style="color: #010102; padding-left: 10px">
                  {{ result['Class Room'] }}
                </h3>
              </label>
              <br />
              <label
                for="message"
                class="formbold-form-label"
                style="color: #6a64f1; display: flex; padding-right: 10px"
              >
                <h4><i>Class:</i></h4>
                <h3 style="color: #010102; padding-left: 10px">
                  {{ result['Class'] }}
                </h3>
              </label>
              {% elif result and 'error' in result %}
              <label
                for="message"
                class="formbold-form-label"
                style="color: #6a64f1; display: flex; padding-right: 10px"
              >
                <h4></h4>
                <h3 style="color: #010102; padding-left: 10px">
                </h3>
              </label>
              <br />
              <label
                for="message"
                class="formbold-form-label"
                style="color: #6a64f1; display: flex; padding-right: 10px"
              >
                <h4></h4>
                <h3 style="color: #010102; padding-left: 10px">
                </h3>
              </label>
              <br />
              <br />
              <div style="color: green; display:flex; justify-content:center;align-items:center; font-size:1.5rem;">
              <h4>{{ result['error'] }}</h4>
              </div>
               <label
                for="message"
                class="formbold-form-label"
                style="color: #6a64f1; display: flex; padding-right: 10px"
              >
                <h4></h4>
                <h3 style="color: #010102; padding-left: 10px">
                </h3>
              </label>
              <br />
              <label
                for="message"
                class="formbold-form-label"
                style="color: #6a64f1; display: flex; padding-right: 10px"
              >
                <h4></h4>
                <h3 style="color: #010102; padding-left: 10px">
                </h3>
              </label>
              <br />
              <br />
              {% else %}
              <label
                for="message"
                class="formbold-form-label"
                style="color: #6a64f1; display: flex; padding-right: 10px"
              >
                <h4><i>Staff Name:</i></h4>
                <h3 style="color: #010102; padding-left: 10px">
                </h3>
              </label>
              <br />
              <label
                for="message"
                class="formbold-form-label"
                style="color: #6a64f1; display: flex; padding-right: 10px"
              >
                <h4><i>Subject:</i></h4>
                <h3 style="color: #010102; padding-left: 10px">
                </h3>
              </label>
              <br />
              <label
                for="message"
                class="formbold-form-label"
                style="color: #6a64f1; display: flex; padding-right: 10px"
              >
                <h4><i>Room No:</i></h4>
                <h3 style="color: #010102; padding-left: 10px">
                </h3>
              </label>
              <br />
              <label
                for="message"
                class="formbold-form-label"
                style="color: #6a64f1; display: flex; padding-right: 10px"
              >
                <h4><i>Class:</i></h4>
                <h3 style="color: #010102; padding-left: 10px">
                </h3>
              {% endif %}
            </div>
          </div>
          <div class="button-container">
        <button class="formbold-btn" type="submit" id="submitBtn" value="Submit" disabled>Search</button>
       <button class="formbold-btn clear-btn" type="button" id="clearBtn">Clear</button>
    </div>
          <h3
            style="
              display: flex;
              align-content: center;
              justify-content: center;
              padding-top: 6px;
            "
          >
          SRMIST FSH Computer Science
          </h3>
        </form>
      </div>
    </div>
  </body>
</html>
