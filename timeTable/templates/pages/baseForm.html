<h2
  style="
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 10px;
  "
>
  Welcome to the SRM Time Table App
</h2>
<div class="formbold-btn-container">
  <a href="/create" class="formbold-btn1">Create Form</a>
</div>
<div class="formbold-main-wrapper">
  <div class="formbold-form-wrapper">
    <form
      style="background-color: #f1ffff; border-radius: 10px; outline: none"
      id="form"
      method="post"
    >
      <div class="formbold-input-flex">
        <div>
          <label for="staffName" class="formbold-form-label">
            <b>Staff Name</b>
          </label>
          <input
            type="text"
            name="staffName"
            id="staffName"
            placeholder="Jane"
            class="formbold-form-input"
          />
        </div>
        <div>
          <label for="class" class="formbold-form-label"> <b>Class</b> </label>
          <input
            type="text"
            name="class"
            id="class"
            placeholder="II CS A"
            class="formbold-form-input"
          />
        </div>
        <div>
          <label for="roomNo" class="formbold-form-label"
            ><b> Room No </b></label
          >
          <input
            type="text"
            name="roomNo"
            id="roomNo"
            placeholder="403"
            class="formbold-form-input"
          />
        </div>
      </div>

      <div class="formbold-input-flex">
        <div>
          <label for="day" class="formbold-form-label"><b>Day</b></label>
          <select name="day" id="day" class="formbold-form-input" required>
            <option value="" disabled selected>Select a day</option>
            <option value="1">Day 1</option>
            <option value="2">Day 2</option>
            <option value="3">Day 3</option>
            <option value="4">Day 4</option>
            <option value="5">Day 5</option>
          </select>
        </div>
        <div>
          <label for="period" class="formbold-form-label"><b>Period</b></label>
          <select
            name="period"
            id="period"
            class="formbold-form-input"
            required
          >
            <option value="" disabled selected>Select a period</option>
            <option value="1">Period 1</option>
            <option value="2">Period 2</option>
            <option value="3">Period 3</option>
            <option value="4">Period 4</option>
            <option value="5">Period 5</option>
            <option value="6">Period 6</option>
            <option value="7">Period 7</option>
            <option value="8">Period 8</option>
            <option value="9">Period 9</option>
          </select>
        </div>
      </div>

      <div>
        <label for="subject" class="formbold-form-label">
          <b> Subject of the period </b>
        </label>
        <textarea
          rows="6"
          name="subject"
          id="subject"
          class="formbold-form-input"
          readonly
          style="overflow:hidden"
        >
{% if result %}
                Staff Name: {{ result['Staff Name'] }}
                Subject: {{ result['Subject'] }}
                Room No: {{ result['Room No'] }}
                Class: {{ result['Class'] }}
{% else %}
  No matching record found.
{% endif %}

      </textarea
        >
      </div>

      <button class="formbold-btn" id="submitBtn" disabled>Search</button>
    </form>
  </div>
</div>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: "Inter", sans-serif;
    background-color: #f4ffff;
  }
  .formbold-main-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px;
    background-color: #f7ffff;
  }

  .formbold-form-wrapper {
    margin: 0 auto;
    max-width: 550px;
    width: 100%;
    background: white;
  }

  .formbold-input-flex {
    display: flex;
    gap: 20px;
    margin-bottom: 15px;
  }
  .formbold-input-flex > div {
    width: 50%;
  }

  .formbold-input-radio-wrapper {
    margin-bottom: 28px;
  }
  .formbold-radio-flex {
    display: flex;
    align-items: center;
    gap: 15px;
  }
  .formbold-radio-label {
    font-size: 14px;
    line-height: 24px;
    color: #07074d;
    position: relative;
    padding-left: 25px;
    cursor: pointer;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
  }
  .formbold-input-radio {
    position: absolute;
    opacity: 0;
    cursor: pointer;
  }
  .formbold-radio-checkmark {
    position: absolute;
    top: -1px;
    left: 0;
    height: 18px;
    width: 18px;
    background-color: #ffffff;
    border: 1px solid #dde3ec;
    border-radius: 50%;
  }
  .formbold-radio-label
    .formbold-input-radio:checked
    ~ .formbold-radio-checkmark {
    background-color: #6a64f1;
  }
  .formbold-radio-checkmark:after {
    content: "";
    position: absolute;
    display: none;
  }

  .formbold-radio-label
    .formbold-input-radio:checked
    ~ .formbold-radio-checkmark:after {
    display: block;
  }

  .formbold-radio-label .formbold-radio-checkmark:after {
    top: 50%;
    left: 50%;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ffffff;
    transform: translate(-50%, -50%);
  }

  .formbold-form-input {
    width: 100%;
    padding: 13px 22px;
    border-radius: 5px;
    border: 1px solid #dde3ec;
    background: #ffffff;
    font-weight: 500;
    font-size: 16px;
    color: #07074d;
    outline: none;
    resize: none;
  }
  .formbold-form-input::placeholder {
    color: #536387;
  }
  .formbold-form-input:focus {
    border-color: #6a64f1;
    box-shadow: 0px 3px 8px rgba(0, 0, 0, 0.05);
  }
  .formbold-form-label {
    color: #07074d;
    font-size: 14px;
    line-height: 24px;
    display: block;
    margin-bottom: 10px;
  }

  .formbold-btn {
    text-align: center;
    width: 100%;
    font-size: 16px;
    border-radius: 5px;
    padding: 14px 25px;
    border: none;
    font-weight: 500;
    background-color: #6a64f1;
    color: white;
    cursor: pointer;
    margin-top: 25px;
  }

  .formbold-btn:disabled {
    background-color: #d3d3d3;
    color: #808080;
    cursor: not-allowed;
  }
  .formbold-btn:hover {
    box-shadow: 0px 3px 8px rgba(0, 0, 0, 0.05);
  }
  .formbold-btn1 {
    text-align: center;
    font-size: 16px;
    border-radius: 5px;
    padding: 14px 25px;
    border: none;
    font-weight: 500;
    background-color: #6a64f1;
    color: white;
    cursor: pointer;
    margin-top: 25px;
    text-decoration: none;
  }
  .formbold-btn1:hover {
    box-shadow: 0px 3px 8px rgba(0, 0, 0, 0.05);
  }
  .formbold-btn-container {
    display: flex;
    flex-direction: column;
    align-items: end;
    justify-content: end;
    text-align: center;
    margin-right: 30px;
  }

  h2 {
    color: #6a64f1;
    margin-bottom: 10px;
  }
</style>
<script>
  function resetForm() {
    document.getElementById("form").reset();
  }
  document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById("form");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("input", function () {
      const requiredFields = form.querySelectorAll("[required]");
      const allFilled = [...requiredFields].every(
        (field) => field.value.trim() !== ""
      );

      submitBtn.disabled = !allFilled;
    });
  });
</script>
